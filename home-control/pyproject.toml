[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-control"
version = "0.1.0"
description = "Local UI and agent for TVs and other devices on your Wi-Fi."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
home-control = "home_control.__main__:main"

[tool.setuptools.packages.find]
include = ["home_control*"]

[tool.setuptools.package-data]
home_control = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
