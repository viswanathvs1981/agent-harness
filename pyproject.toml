[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Generic, droppable AI engineering harness: graph + loop runtime, shareable skills, isolated agents, self-evolution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Atlas Harness" }]
keywords = ["agents", "skills", "harness", "langgraph", "eval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "agent_harness.cli:main"

[tool.setuptools.packages.find]
include = ["agent_harness*"]

[tool.setuptools.package-data]
agent_harness = ["py.typed", "catalog/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
