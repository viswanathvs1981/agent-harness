[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Droppable bots and skills. Read-only by default."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bots = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]
